<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamentos · Bee Like</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
    <style>
        /* ── KPIs ── */
        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:24px; }
        .kpi-card { background:var(--bg-card); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:16px; }
        .kpi-label { font-size:var(--text-xs); color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
        .kpi-value { font-size:1.5rem; font-weight:700; color:var(--text-primary); }
        .kpi-sub   { font-size:var(--text-xs); color:var(--text-muted); margin-top:2px; }
        .kpi-card.accent-green .kpi-value { color:#22c55e; }
        .kpi-card.accent-amber .kpi-value { color:#f59e0b; }
        .kpi-card.accent-red   .kpi-value { color:#ef4444; }

        /* ── Filters ── */
        .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
        .filters .form-group { margin:0; min-width:140px; }
        .filters .form-group label { font-size:var(--text-xs); color:var(--text-muted); display:block; margin-bottom:4px; }
        .filter-search { flex:1; min-width:200px; }

        /* ── Table ── */
        .budget-table { width:100%; border-collapse:collapse; font-size:var(--text-sm); }
        .budget-table th {
            text-align:left; padding:10px 12px;
            color:var(--text-muted); font-weight:600; font-size:var(--text-xs);
            text-transform:uppercase; letter-spacing:.05em;
            border-bottom:1px solid var(--border-subtle);
            white-space:nowrap; cursor:pointer; user-select:none;
        }
        .budget-table th:hover { color:var(--text-primary); }
        .budget-table th .sort-arrow { margin-left:4px; opacity:.4; font-size:10px; }
        .budget-table th.sort-asc  .sort-arrow,
        .budget-table th.sort-desc .sort-arrow { opacity:1; color:var(--accent); }
        .budget-table td { padding:12px; border-bottom:1px solid var(--border-subtle); vertical-align:middle; }
        .budget-table tr:last-child td { border-bottom:none; }
        .budget-table tbody tr:hover { background:rgba(255,255,255,.03); }
        .col-code    { font-family:monospace; font-size:var(--text-xs); color:var(--text-muted); }
        .col-value   { font-weight:600; color:var(--text-primary); }
        .col-actions { display:flex; gap:4px; }

        /* ── Status select ── */
        .status-select {
            font-size:11px; font-weight:600;
            border:1px solid var(--border-subtle);
            border-radius:var(--radius-full);
            padding:3px 8px;
            background:#1a1a24;
            color:var(--text-primary);
            cursor:pointer;
            appearance:none; -webkit-appearance:none;
        }
        .status-select option { background:#1a1a24; color:var(--text-primary); }

        /* ── Status badge ── */
        .status-badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600; }
        .status-pendente { background:rgba(245,158,11,.15); color:#f59e0b; }
        .status-aceito   { background:rgba(34,197,94,.15);  color:#22c55e; }
        .status-recusado { background:rgba(239,68,68,.15);  color:#ef4444; }

        /* ── Modal ── */
        .modal-overlay {
            position:fixed; inset:0;
            background:rgba(0,0,0,.75);
            backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);
            z-index:1000; display:flex;
            align-items:center; justify-content:center; padding:16px;
        }
        .modal-overlay.hidden { display:none; }
        .modal {
            background:#16161f;
            border:1px solid var(--border-medium);
            border-radius:var(--radius-xl);
            width:100%; max-width:740px;
            max-height:90vh; overflow-y:auto;
            box-shadow:0 24px 64px rgba(0,0,0,.7);
        }
        .modal-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 16px; border-bottom:1px solid var(--border-subtle); }
        .modal-header h3 { font-size:var(--text-lg); font-weight:700; margin:0; color:var(--text-primary); }
        .modal-body   { padding:24px; }
        .modal-footer { padding:16px 24px; border-top:1px solid var(--border-subtle); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
        .btn-close { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-muted); line-height:1; padding:4px; }

        /* ── Detail table ── */
        .budget-detail-section { margin-bottom:20px; }
        .budget-detail-section h4 { font-size:var(--text-xs); text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); margin-bottom:10px; }
        .detail-table { width:100%; border-collapse:collapse; font-size:var(--text-sm); }
        .detail-table th { text-align:left; padding:8px 10px; background:rgba(255,255,255,.04); font-size:var(--text-xs); color:var(--text-muted); }
        .detail-table td { padding:8px 10px; border-top:1px solid var(--border-subtle); color:var(--text-primary); }
        .text-right { text-align:right; }
        .detail-total { font-weight:700; color:var(--accent); }

        /* ── Empty state ── */
        .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
        .empty-state .empty-icon { font-size:48px; margin-bottom:12px; }

        /* ── Export bar ── */
        .export-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .export-bar span { font-size:var(--text-xs); color:var(--text-muted); }

        @media print {
            .no-print { display:none !important; }
            .modal-overlay { position:static; background:none; backdrop-filter:none; padding:0; display:block; }
            .modal { border:none; max-height:none; box-shadow:none; background:#fff; color:#000; }
            .modal-header, .modal-footer { display:none; }
            .detail-table th, .detail-table td { color:#000; border-color:#ccc; }
        }
    </style>
</head>
<body>
<div class="app-container">

    <!-- HEADER -->
    <header class="app-header no-print">
        <div class="app-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.18L18.39 7.5 12 10.82 5.61 7.5 12 4.18zM5 9.06l6 3.32v6.44l-6-3.32V9.06zm8 9.76V12.38l6-3.32v6.44l-6 3.32z"/>
                </svg>
            </div>
            <div class="logo-text">
                <span class="logo-brand">Bee Like</span>
                <span class="logo-sub">Orçamentos</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn btn-ghost">← Novo Orçamento</a>
            <a href="config.html" class="btn btn-ghost">⚙ Configurações</a>
        </div>
    </header>

    <main>

        <!-- KPIs -->
        <div class="kpi-grid no-print">
            <div class="kpi-card"><div class="kpi-label">Total de Orçamentos</div><div class="kpi-value" id="kpi-total">—</div></div>
            <div class="kpi-card accent-green"><div class="kpi-label">Aceitos</div><div class="kpi-value" id="kpi-aceitos">—</div><div class="kpi-sub" id="kpi-conv">conversão —</div></div>
            <div class="kpi-card accent-amber"><div class="kpi-label">Pendentes</div><div class="kpi-value" id="kpi-pendentes">—</div></div>
            <div class="kpi-card accent-red"><div class="kpi-label">Recusados</div><div class="kpi-value" id="kpi-recusados">—</div></div>
            <div class="kpi-card"><div class="kpi-label">Valor Total (venda)</div><div class="kpi-value" id="kpi-valor">—</div></div>
            <div class="kpi-card accent-green"><div class="kpi-label">Valor Aceitos</div><div class="kpi-value" id="kpi-valor-aceito">—</div></div>
        </div>

        <!-- Filtros + Export -->
        <div class="card animate-fade-in no-print mb-lg">
            <div class="filters" style="margin-bottom:12px;">
                <div class="form-group filter-search">
                    <label>Buscar</label>
                    <input type="text" class="form-input" id="filter-search" placeholder="Código, cliente, e-mail...">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select class="form-input" id="filter-status">
                        <option value="">Todos</option>
                        <option value="pendente">⏳ Pendente</option>
                        <option value="aceito">✅ Aceito</option>
                        <option value="recusado">❌ Recusado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>De</label>
                    <input type="date" class="form-input" id="filter-from">
                </div>
                <div class="form-group">
                    <label>Até</label>
                    <input type="date" class="form-input" id="filter-to">
                </div>
                <div class="form-group" style="align-self:flex-end;">
                    <button class="btn btn-ghost" id="btn-clear-filters">✕ Limpar</button>
                </div>
            </div>
            <div class="export-bar">
                <span>Exportar:</span>
                <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" onclick="exportData('csv')">CSV</button>
                <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" onclick="exportData('excel')">Excel</button>
                <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" onclick="exportData('txt')">TXT</button>
                <button class="btn btn-ghost" style="font-size:12px;padding:4px 10px;" onclick="exportData('pdf')">PDF</button>
            </div>
        </div>

        <!-- Tabela -->
        <div class="card animate-fade-in">
            <div id="budget-list-wrapper">
                <div class="empty-state" id="loading-state">
                    <div class="empty-icon">⏳</div>
                    <p>Carregando orçamentos...</p>
                </div>
            </div>
        </div>

    </main>
    <div style="height:64px;"></div>
</div>

<!-- MODAL VISUALIZAR/EDITAR -->
<div class="modal-overlay hidden no-print" id="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">Orçamento</h3>
            <button class="btn-close" id="modal-close">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer">
            <button class="btn btn-ghost" id="modal-close2">Fechar</button>
            <button class="btn btn-ghost" id="btn-modal-print">🖨 Imprimir</button>
            <button class="btn btn-secondary" id="btn-modal-new-client" title="Novo orçamento com este cliente">👤 Novo p/ Cliente</button>
            <button class="btn btn-secondary" id="btn-modal-edit">✏️ Editar</button>
            <button class="btn btn-primary" id="btn-modal-save" style="display:none;">💾 Salvar Alterações</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
    <span class="toast-icon">✅</span>
    <span class="toast-text" id="toast-text"></span>
</div>

<script src="js/storage.js"></script>
<script>
(function () {
    'use strict';

    const config = Storage.getConfig();
    const apiUrl = config.apiUrl || '';

    let allBudgets = [];
    let editingId  = null;
    let sortCol    = 'savedAt';
    let sortDir    = 'desc'; // 'asc' | 'desc'

    /* ── Formatação ── */
    const fmtBRL = v => 'R$\u00a0' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtDate = s => {
        if (!s) return '—';
        const d = new Date(s);
        return isNaN(d) ? (s.split(',')[0] || s) : d.toLocaleDateString('pt-BR');
    };

    /* ── Toast ── */
    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        document.getElementById('toast-text').textContent = msg;
        t.className = 'toast ' + type;
        t.querySelector('.toast-icon').textContent = type === 'success' ? '✅' : '⚠️';
        void t.offsetWidth;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    /* ── Totais ── */
    function totalVenda(b) { return (b.items || []).reduce((s, i) => s + (i.salePrice || 0), 0); }
    function totalCusto(b) { return (b.items || []).reduce((s, i) => s + (i.totalCost || 0), 0); }

    /* ── Carregar ── */
    async function loadBudgets() {
        if (!apiUrl) {
            document.getElementById('budget-list-wrapper').innerHTML =
                '<div class="empty-state"><div class="empty-icon">⚙️</div><p>Configure a URL da API em <a href="config.html">Configurações</a>.</p></div>';
            return;
        }
        try {
            const r    = await fetch(apiUrl + '/api/budgets');
            const data = await r.json();
            allBudgets = (data.budgets || []).map((b, i) => ({
                ...b,
                id:     b.id     || ('b_legacy_' + i),
                status: b.status || 'pendente'
            }));
            renderKPIs(allBudgets);
            renderTable();
        } catch {
            document.getElementById('budget-list-wrapper').innerHTML =
                '<div class="empty-state"><div class="empty-icon">❌</div><p>Erro ao carregar. Verifique a conexão com o servidor.</p></div>';
        }
    }

    /* ── KPIs ── */
    function renderKPIs(budgets) {
        const total     = budgets.length;
        const aceitos   = budgets.filter(b => b.status === 'aceito');
        const pendentes = budgets.filter(b => b.status === 'pendente').length;
        const recusados = budgets.filter(b => b.status === 'recusado').length;
        const valorTotal  = budgets.reduce((s, b) => s + totalVenda(b), 0);
        const valorAceito = aceitos.reduce((s, b) => s + totalVenda(b), 0);
        const conv = total > 0 ? Math.round(aceitos.length / total * 100) : 0;

        document.getElementById('kpi-total').textContent        = total;
        document.getElementById('kpi-aceitos').textContent      = aceitos.length;
        document.getElementById('kpi-conv').textContent         = `conversão ${conv}%`;
        document.getElementById('kpi-pendentes').textContent    = pendentes;
        document.getElementById('kpi-recusados').textContent    = recusados;
        document.getElementById('kpi-valor').textContent        = fmtBRL(valorTotal);
        document.getElementById('kpi-valor-aceito').textContent = fmtBRL(valorAceito);
    }

    /* ── Filtro + ordenação ── */
    function getFiltered() {
        const search = document.getElementById('filter-search').value.trim().toLowerCase();
        const status = document.getElementById('filter-status').value;
        const from   = document.getElementById('filter-from').value;
        const to     = document.getElementById('filter-to').value;

        let list = allBudgets.filter(b => {
            if (status && b.status !== status) return false;
            if (from || to) {
                const d = new Date(b.savedAt || b.date);
                if (from && d < new Date(from)) return false;
                if (to   && d > new Date(to + 'T23:59:59')) return false;
            }
            if (search) {
                const hay = [b.budgetCode, b.clientName, b.clientCnpj, b.clientEmail].join(' ').toLowerCase();
                if (!hay.includes(search)) return false;
            }
            return true;
        });

        // Ordenação
        list = list.slice().sort((a, b) => {
            let va, vb;
            if (sortCol === 'savedAt') {
                va = new Date(a.savedAt || a.date).getTime();
                vb = new Date(b.savedAt || b.date).getTime();
            } else if (sortCol === 'valor') {
                va = totalVenda(a); vb = totalVenda(b);
            } else if (sortCol === 'clientName') {
                va = (a.clientName || '').toLowerCase();
                vb = (b.clientName || '').toLowerCase();
            } else if (sortCol === 'budgetCode') {
                va = a.budgetCode || ''; vb = b.budgetCode || '';
            } else if (sortCol === 'status') {
                va = a.status || ''; vb = b.status || '';
            } else {
                va = a[sortCol] || ''; vb = b[sortCol] || '';
            }
            if (va < vb) return sortDir === 'asc' ? -1 : 1;
            if (va > vb) return sortDir === 'asc' ?  1 : -1;
            return 0;
        });

        return list;
    }

    function setSort(col) {
        if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        else { sortCol = col; sortDir = col === 'savedAt' ? 'desc' : 'asc'; }
        renderTable();
    }
    window.setSort = setSort;

    function sortArrow(col) {
        if (sortCol !== col) return '<span class="sort-arrow">⇅</span>';
        return `<span class="sort-arrow">${sortDir === 'asc' ? '↑' : '↓'}</span>`;
    }

    /* ── Tabela ── */
    function renderTable() {
        const filtered = getFiltered();
        const wrapper  = document.getElementById('budget-list-wrapper');

        if (filtered.length === 0) {
            wrapper.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>Nenhum orçamento encontrado.</p></div>';
            return;
        }

        const thClass = col => `${sortCol === col ? ('sort-' + sortDir) : ''}`;

        wrapper.innerHTML = `
        <div style="overflow-x:auto;">
        <table class="budget-table">
            <thead><tr>
                <th class="${thClass('budgetCode')}" onclick="setSort('budgetCode')">Código ${sortArrow('budgetCode')}</th>
                <th class="${thClass('savedAt')}"    onclick="setSort('savedAt')">Data ${sortArrow('savedAt')}</th>
                <th class="${thClass('clientName')}" onclick="setSort('clientName')">Cliente ${sortArrow('clientName')}</th>
                <th>Itens</th>
                <th class="${thClass('valor')}"  onclick="setSort('valor')">Valor Venda ${sortArrow('valor')}</th>
                <th class="${thClass('status')}" onclick="setSort('status')">Status ${sortArrow('status')}</th>
                <th>Ações</th>
            </tr></thead>
            <tbody>
            ${filtered.map(b => `
                <tr>
                    <td class="col-code">#${b.budgetCode || '—'}</td>
                    <td>${fmtDate(b.savedAt || b.date)}</td>
                    <td>
                        <div style="font-weight:600;color:var(--text-primary)">${b.clientName || '—'}</div>
                        ${b.clientEmail ? `<div style="font-size:11px;color:var(--text-muted)">${b.clientEmail}</div>` : ''}
                    </td>
                    <td style="color:var(--text-secondary)">${(b.items || []).length} item(s)</td>
                    <td class="col-value">${fmtBRL(totalVenda(b))}</td>
                    <td>
                        <select class="status-select" onchange="updateStatus('${b.id}', this.value)">
                            <option value="pendente" ${b.status==='pendente'?'selected':''}>⏳ Pendente</option>
                            <option value="aceito"   ${b.status==='aceito'  ?'selected':''}>✅ Aceito</option>
                            <option value="recusado" ${b.status==='recusado'?'selected':''}>❌ Recusado</option>
                        </select>
                    </td>
                    <td>
                        <div class="col-actions">
                            <button class="btn btn-ghost btn-icon" title="Visualizar" onclick="openModal('${b.id}', false)">👁</button>
                            <button class="btn btn-ghost btn-icon" title="Editar"     onclick="openModal('${b.id}', true)">✏️</button>
                            <button class="btn btn-ghost btn-icon" title="Excluir" style="color:#ef4444" onclick="deleteBudget('${b.id}')">🗑️</button>
                        </div>
                    </td>
                </tr>`).join('')}
            </tbody>
        </table></div>`;
    }

    /* ── Status inline ── */
    window.updateStatus = async function(id, status) {
        const b = allBudgets.find(x => x.id === id);
        if (!b) return;
        b.status = status;
        try {
            await fetch(apiUrl + '/api/budgets/' + encodeURIComponent(id), {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            renderKPIs(allBudgets);
            showToast('Status atualizado!');
        } catch { showToast('Erro ao atualizar status.', 'error'); }
    };

    /* ── Excluir ── */
    window.deleteBudget = async function(id) {
        const b = allBudgets.find(x => x.id === id);
        if (!b) return;
        if (!confirm(`Excluir orçamento #${b.budgetCode}? Esta ação não pode ser desfeita.`)) return;
        try {
            await fetch(apiUrl + '/api/budgets/' + encodeURIComponent(id), { method: 'DELETE' });
            allBudgets = allBudgets.filter(x => x.id !== id);
            renderKPIs(allBudgets);
            renderTable();
            showToast('Orçamento excluído.');
        } catch { showToast('Erro ao excluir.', 'error'); }
    };

    /* ── Modal ── */
    window.openModal = function(id, editMode) {
        const b = allBudgets.find(x => x.id === id);
        if (!b) return;
        editingId = id;

        document.getElementById('modal-title').textContent = `Orçamento #${b.budgetCode || '—'}${editMode ? ' — Edição' : ''}`;
        document.getElementById('modal-body').innerHTML    = renderModalBody(b, editMode);
        document.getElementById('btn-modal-edit').style.display = editMode ? 'none' : '';
        document.getElementById('btn-modal-save').style.display = editMode ? '' : 'none';
        document.getElementById('modal-overlay').classList.remove('hidden');
    };

    function renderModalBody(b, editMode) {
        const items  = b.items || [];
        const venda  = totalVenda(b);
        const custo  = totalCusto(b);

        const clientSection = editMode ? `
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Nome</label>
                    <input class="form-input" id="edit-client-name"  value="${esc(b.clientName)}">
                </div>
                <div class="form-group">
                    <label class="form-label">CNPJ</label>
                    <input class="form-input" id="edit-client-cnpj"  value="${esc(b.clientCnpj)}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Telefone</label>
                    <input class="form-input" id="edit-client-phone" value="${esc(b.clientPhone)}">
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input class="form-input" id="edit-client-email" value="${esc(b.clientEmail)}">
                </div>
            </div>
            <div class="form-group" style="margin-top:8px;">
                <label class="form-label">Status</label>
                <select class="form-input" id="edit-status">
                    <option value="pendente" ${b.status==='pendente'?'selected':''}>⏳ Pendente</option>
                    <option value="aceito"   ${b.status==='aceito'  ?'selected':''}>✅ Aceito</option>
                    <option value="recusado" ${b.status==='recusado'?'selected':''}>❌ Recusado</option>
                </select>
            </div>` : `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:var(--text-sm);color:var(--text-secondary);">
                <div><span style="color:var(--text-muted)">Cliente:</span> <strong style="color:var(--text-primary)">${esc(b.clientName) || '—'}</strong></div>
                <div><span style="color:var(--text-muted)">CNPJ:</span> ${esc(b.clientCnpj) || '—'}</div>
                <div><span style="color:var(--text-muted)">Telefone:</span> ${esc(b.clientPhone) || '—'}</div>
                <div><span style="color:var(--text-muted)">E-mail:</span> ${esc(b.clientEmail) || '—'}</div>
            </div>
            <div style="margin-top:10px;">
                <span class="status-badge status-${b.status}">${{pendente:'⏳ Pendente',aceito:'✅ Aceito',recusado:'❌ Recusado'}[b.status] || b.status}</span>
            </div>`;

        const itemsRows = items.map((item, i) => editMode ? `<tr>
                <td style="color:var(--text-primary)">${esc(item.productName)}</td>
                <td style="color:var(--text-secondary)">${esc(item.description) || '—'}</td>
                <td><input type="number" class="form-input" style="width:75px;padding:4px 6px;" value="${item.quantity}" min="1"
                    onchange="updateItemField(${i},'quantity',+this.value)"></td>
                <td class="text-right" style="color:var(--text-secondary)">${fmtBRL(item.totalCost)}</td>
                <td class="text-right"><input type="number" class="form-input" style="width:100px;padding:4px 6px;" value="${item.salePrice}" step="0.01"
                    onchange="updateItemField(${i},'salePrice',+this.value)"></td>
            </tr>` : `<tr>
                <td style="color:var(--text-primary)">${esc(item.productName)}</td>
                <td style="color:var(--text-secondary)">${esc(item.description) || '—'}</td>
                <td style="color:var(--text-secondary)">${item.quantity}</td>
                <td class="text-right" style="color:var(--text-secondary)">${fmtBRL(item.totalCost)}</td>
                <td class="text-right detail-total">${fmtBRL(item.salePrice)}</td>
            </tr>`).join('');

        return `
        <div class="budget-detail-section">
            <h4>📋 Dados — #${b.budgetCode || '—'} · ${fmtDate(b.savedAt || b.date)}</h4>
            ${clientSection}
        </div>
        <div class="budget-detail-section">
            <h4>🛒 Itens</h4>
            <table class="detail-table">
                <thead><tr>
                    <th>Produto</th><th>Descrição</th><th>Qtd</th>
                    <th class="text-right">Custo</th><th class="text-right">Venda</th>
                </tr></thead>
                <tbody id="detail-tbody">${itemsRows}</tbody>
                <tfoot><tr style="font-weight:700;">
                    <td colspan="3" style="color:var(--text-primary)">Total</td>
                    <td class="text-right" id="modal-total-custo" style="color:var(--text-secondary)">${fmtBRL(custo)}</td>
                    <td class="text-right detail-total" id="modal-total-venda">${fmtBRL(venda)}</td>
                </tr></tfoot>
            </table>
        </div>`;
    }

    function esc(s) {
        return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* ── Edição de itens no modal ── */
    window.updateItemField = function(idx, field, value) {
        const b = allBudgets.find(x => x.id === editingId);
        if (!b || !b.items[idx]) return;
        b.items[idx][field] = value;
        const el = document.getElementById('modal-total-venda');
        const el2 = document.getElementById('modal-total-custo');
        if (el)  el.textContent  = fmtBRL(totalVenda(b));
        if (el2) el2.textContent = fmtBRL(totalCusto(b));
    };

    /* ── Salvar edição ── */
    document.getElementById('btn-modal-save').addEventListener('click', async () => {
        const b = allBudgets.find(x => x.id === editingId);
        if (!b) return;
        const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        b.clientName  = v('edit-client-name');
        b.clientCnpj  = v('edit-client-cnpj');
        b.clientPhone = v('edit-client-phone');
        b.clientEmail = v('edit-client-email');
        const statEl  = document.getElementById('edit-status');
        if (statEl) b.status = statEl.value;
        try {
            await fetch(apiUrl + '/api/budgets/' + encodeURIComponent(editingId), {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(b)
            });
            renderKPIs(allBudgets);
            renderTable();
            closeModal();
            showToast('Orçamento atualizado!');
        } catch { showToast('Erro ao salvar.', 'error'); }
    });

    /* ── Editar (view → edit) ── */
    document.getElementById('btn-modal-edit').addEventListener('click', () => {
        openModal(editingId, true);
    });

    /* ── Novo orçamento para o mesmo cliente ── */
    document.getElementById('btn-modal-new-client').addEventListener('click', () => {
        const b = allBudgets.find(x => x.id === editingId);
        if (!b) return;
        const params = new URLSearchParams({
            clientName:  b.clientName  || '',
            clientCnpj:  b.clientCnpj  || '',
            clientPhone: b.clientPhone || '',
            clientEmail: b.clientEmail || ''
        });
        window.location.href = 'index.html?' + params.toString();
    });

    /* ── Imprimir ── */
    document.getElementById('btn-modal-print').addEventListener('click', () => window.print());

    /* ── Fechar modal ── */
    function closeModal() {
        document.getElementById('modal-overlay').classList.add('hidden');
        editingId = null;
    }
    document.getElementById('modal-close').addEventListener('click',  closeModal);
    document.getElementById('modal-close2').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    /* ── Filtros ── */
    ['filter-search','filter-status','filter-from','filter-to'].forEach(id => {
        document.getElementById(id).addEventListener('input', renderTable);
    });
    document.getElementById('btn-clear-filters').addEventListener('click', () => {
        ['filter-search','filter-status','filter-from','filter-to'].forEach(id => {
            document.getElementById(id).value = '';
        });
        renderTable();
    });

    /* ── Exportação ── */
    window.exportData = function(format) {
        const data = getFiltered();
        if (data.length === 0) { showToast('Nenhum dado para exportar.', 'error'); return; }

        // Expande: uma linha por item do orçamento
        const header = ['Código','Data','Nome','CNPJ','Telefone','E-mail','Produto','Descrição','Quantidade','Custo (R$)','Venda (R$)','Status'];
        const expandRows = data.flatMap(b =>
            (b.items || []).map(item => [
                b.budgetCode                          || '',
                fmtDate(b.savedAt || b.date),
                b.clientName                          || '',
                b.clientCnpj                          || '',
                b.clientPhone                         || '',
                b.clientEmail                         || '',
                item.productName                      || '',
                item.description                      || '',
                item.quantity                         || 0,
                Number(item.totalCost  || 0).toFixed(2),
                Number(item.salePrice  || 0).toFixed(2),
                b.status                              || ''
            ])
        );

        if (format === 'csv' || format === 'excel') {
            const sep = format === 'excel' ? '\t' : ',';
            const q   = v => format === 'excel'
                ? (v == null ? '' : String(v))
                : `"${String(v == null ? '' : v).replace(/"/g,'""')}"`;
            const content = [header.map(q).join(sep), ...expandRows.map(r => r.map(q).join(sep))].join('\n');
            const ext  = format === 'excel' ? 'xls' : 'csv';
            const mime = format === 'excel' ? 'application/vnd.ms-excel' : 'text/csv';
            download(content, `orcamentos.${ext}`, mime);

        } else if (format === 'txt') {
            const colW = [8,10,20,18,14,24,16,20,5,10,10,10];
            const pad  = (s, w) => String(s || '').substring(0, w).padEnd(w);
            const line = r => r.map((v, i) => pad(v, colW[i])).join(' | ');
            const sep  = colW.map(w => '-'.repeat(w)).join('-+-');
            const lines = [line(header), sep, ...expandRows.map(line)];
            download(lines.join('\n'), 'orcamentos.txt', 'text/plain');

        } else if (format === 'pdf') {
            const rows = expandRows.map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('');
            const ths  = header.map(h => `<th>${h}</th>`).join('');
            const win  = window.open('', '_blank');
            win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
                <title>Orçamentos Bee Like</title>
                <style>
                body{font-family:sans-serif;font-size:11px;padding:20px}
                h2{margin-bottom:12px;font-size:14px}
                table{width:100%;border-collapse:collapse}
                th,td{border:1px solid #ccc;padding:4px 6px;text-align:left;white-space:nowrap}
                th{background:#f5f5f5;font-weight:600}
                tr:nth-child(even){background:#fafafa}
                @media print{@page{size:landscape}}
                </style>
                </head><body>
                <h2>Orçamentos Bee Like — ${new Date().toLocaleDateString('pt-BR')}</h2>
                <table><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table>
                <script>window.onload=()=>{window.print();window.close()}<\/script>
                </body></html>`);
            win.document.close();
        }
    };

    function download(content, filename, mime) {
        const blob = new Blob(['\uFEFF' + content], { type: mime + ';charset=utf-8;' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    }

    /* ── Start ── */
    loadBudgets();
})();
</script>
</body>
</html>
